# Builds the precompiled PostgreSQL archives that elixir_make downloads.
#
# Each target builds natively on its own runner inside Debian bookworm. That
# pins the glibc baseline to 2.36, so the binaries run on any Nerves system
# with glibc 2.36 or newer, and on most desktop Linux distributions.
#
# Pushing a v* tag publishes a GitHub release with the archives. Pushes and
# pull requests that touch the build, and manual runs, only build and smoke
# test them and upload them as workflow artifacts.
name: Precompile

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - Makefile
      - mix.exs
      - mix.lock
      - scripts/**
      - .github/workflows/precompile.yml
  pull_request:
    paths:
      - Makefile
      - mix.exs
      - mix.lock
      - scripts/**
      - .github/workflows/precompile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  precompile:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    container:
      image: hexpm/elixir:1.20.5-erlang-29.1.3-debian-bookworm-20261123
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
    env:
      MIX_ENV: prod
      # Only build for the runner's own architecture
      CC_PRECOMPILER_PRECOMPILE_ONLY_LOCAL: "true"
      ELIXIR_MAKE_CACHE_DIR: cache
      # Archives must include WAL-G, so fail instead of skipping it
      JUST_POSTGRES_WALG: "yes"
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential bison flex perl curl ca-certificates git \
            libssl-dev zlib1g-dev

      - uses: actions/checkout@v4

      # For WAL-G. Go fetches a newer toolchain itself if WAL-G needs one.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false

      - uses: actions/cache@v4
        with:
          path: ~/.cache/just_postgres
          key: sources-${{ hashFiles('Makefile') }}

      - run: mix local.hex --force && mix local.rebar --force

      - run: mix deps.get --only prod

      - run: mix elixir_make.precompile

      - name: Smoke test
        run: scripts/smoke_test.sh cache/just_postgres-port-${{ matrix.target }}-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: cache/*.tar.gz
          if-no-files-found: error

  release:
    needs: precompile
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: cd artifacts && sha256sum *.tar.gz | tee checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
